services:
  frontend:
    build: .
    ports:
      - "9090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./server
    image: egonio-backend:latest
    ports:
      - "3002:3000"
    volumes:
      - ./diagrams_data:/data/diagrams
    environment:
      - DATA_DIR=/data/diagrams
      - PORT=3000
